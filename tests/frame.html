<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>frame</title>
<style>html,body{margin:0;background:#888}iframe{border:0;display:block;background:#fff}</style>
</head>
<body>
<!-- Screenshot helper: frame.html?w=390&h=844#/route renders the site at an exact viewport size
     (headless browsers enforce a minimum window width). -->
<iframe id="f" title="app"></iframe>
<script>
  const q = new URLSearchParams(location.search);
  const f = document.getElementById('f');
  f.style.width = `${q.get('w') || 390}px`;
  f.style.height = `${q.get('h') || 844}px`;
  f.src = `../index.html${location.hash}`;
</script>
</body>
</html>
